[package]
name = "lazymail-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
lazymail-accounts = { path = "../accounts" }
lazymail-store = { path = "../store" }
mail-parser = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
lazymail-store = { path = "../store", features = ["test-wrapper"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
wiremock = "0.6"
