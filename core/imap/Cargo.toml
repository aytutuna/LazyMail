[package]
name = "lazymail-imap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
lazymail-accounts = { path = "../accounts" }
lazymail-store = { path = "../store" }
mail-parser = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
lazymail-store = { path = "../store", features = ["test-wrapper"] }
lazymail-testserver = { path = "../testserver" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
