[package]
name = "lazymail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lazymail"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
lazymail-core = { path = "..", features = ["dev-key"] }
