[package]
name = "lazymail-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
lazymail-accounts = { path = "../accounts" }
lazymail-store = { path = "../store" }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-builder = "2.0.1"
mail-parser = { version = "1.0.2", default-features = false }
thiserror = "2"

[dev-dependencies]
lazymail-store = { path = "../store", features = ["test-wrapper"] }
base64 = "0.22"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }
