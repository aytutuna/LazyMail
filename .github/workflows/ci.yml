name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - uses: EmbarkStudios/cargo-deny-action@v2

  core-servers:
    # dovecot.conf.in is the 2.3 format; 24.04 still ships 2.3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Dovecot
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dovecot-core dovecot-imapd
      - name: Test against the servers
        run: |
          testdata/servers/start.sh > "$RUNNER_TEMP/servers.env"
          . "$RUNNER_TEMP/servers.env"
          cargo test --workspace -- --include-ignored
      - name: Stop the servers
        if: always()
        run: testdata/servers/stop.sh

  windows:
    runs-on: windows-latest
    env:
      BINDGEN_CS_TAG: v0.12.0+v0.32.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache uniffi-bindgen-cs
        id: bindgen
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.BINDGEN_CS_TAG }}-${{ runner.os }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag $env:BINDGEN_CS_TAG --locked
      - name: Build the core
        run: |
          cargo build -p lazymail-core --release --target x86_64-pc-windows-msvc
          cargo build -p lazymail-core --release --target aarch64-pc-windows-msvc
      - name: Generate the C# bindings
        run: uniffi-bindgen-cs --library target/x86_64-pc-windows-msvc/release/lazymail_core.dll --out-dir windows/LazyMail.App/Generated
      - name: Publish x64
        run: dotnet publish windows/LazyMail.App -c Release -r win-x64 -p:Platform=x64 -p:CoreDir=${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\ -o "$env:RUNNER_TEMP/publish-x64"
      - name: Start the app
        shell: powershell
        run: ./windows/smoke.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'publish-x64/LazyMail.exe')
      - name: Publish arm64
        run: dotnet publish windows/LazyMail.App -c Release -r win-arm64 -p:Platform=ARM64 -p:CoreDir=${{ github.workspace }}\target\aarch64-pc-windows-msvc\release\ -o "$env:RUNNER_TEMP/publish-arm64"

  macos:
    runs-on: macos-26
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the core
        run: apple/build-core.sh
      - name: Write the project
        run: xcodegen generate --spec apple/project.yml
      - name: Test on the Mac
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          xcodebuild test \
            -project apple/LazyMail.xcodeproj \
            -scheme LazyMail \
            -destination "platform=macOS" \
            -resultBundlePath "$RUNNER_TEMP/macos.xcresult" \
            CORE_VERSION="$version" \
            CODE_SIGN_IDENTITY=-

  ios:
    runs-on: macos-26
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Pick the simulators
        id: sim
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          pick() {
            jq -r --arg p "$1" '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith($p)))][0].udid' "$RUNNER_TEMP/sims.json"
          }
          iphone=$(pick 'iPhone 17')
          echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          echo "ipad=$(pick 'iPad')" >> "$GITHUB_OUTPUT"
          # a cold boot takes minutes, let it run while the core builds
          xcrun simctl boot "$iphone"
      - name: Build the core
        run: apple/build-core.sh
      - name: Cross-build the accounts crate
        run: |
          cargo build -p lazymail-accounts --target aarch64-apple-ios
          cargo build -p lazymail-accounts --target aarch64-apple-ios-sim
      - name: Write the project
        run: xcodegen generate --spec apple/project.yml
      - name: Build for the iPad
        run: |
          xcodebuild build \
            -project apple/LazyMail.xcodeproj \
            -scheme LazyMail \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.ipad }}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Boot the iPhone simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.iphone }}" -b
      - name: Test on the iPhone
        run: |
          set -o pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          xcodebuild test \
            -project apple/LazyMail.xcodeproj \
            -scheme LazyMail \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -resultBundlePath "$RUNNER_TEMP/ios.xcresult" \
            CORE_VERSION="$version" \
            CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NDK_VERSION: 4.1.2
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Cache cargo-ndk
        id: ndk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}
      - name: Install cargo-ndk
        if: steps.ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version $CARGO_NDK_VERSION --locked
      - name: Build the core
        run: android/build-core.sh
      - name: Cross-build the accounts crate
        run: cargo ndk -t arm64-v8a -t x86_64 build -p lazymail-accounts
      - name: Build the app
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - name: Check the libraries are in the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk.txt"
          grep -q 'lib/arm64-v8a/liblazymail_core.so' "$RUNNER_TEMP/apk.txt"
          grep -q 'lib/x86_64/liblazymail_core.so' "$RUNNER_TEMP/apk.txt"
          grep -q 'lib/arm64-v8a/libjnidispatch.so' "$RUNNER_TEMP/apk.txt"
          grep -q 'lib/x86_64/libjnidispatch.so' "$RUNNER_TEMP/apk.txt"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --console=plain

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  store-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build and test the store
        run: cargo test -p lazymail-store --target x86_64-pc-windows-msvc
      - name: Build the store for arm64
        run: cargo build -p lazymail-store --target aarch64-pc-windows-msvc

  store-apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lazymail-store
      - run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build -p lazymail-store --target $t
          done

  store-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo ndk -t arm64-v8a -t x86_64 build -p lazymail-store
