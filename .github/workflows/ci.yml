name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache uniffi-bindgen-cs
        id: bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-v0.12.0+v0.32.0-${{ runner.os }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.12.0+v0.32.0 --locked
      - name: Build the core
        run: |
          cargo build -p lazymail-core --release --target x86_64-pc-windows-msvc
          cargo build -p lazymail-core --release --target aarch64-pc-windows-msvc
      - name: Generate the C# bindings
        run: uniffi-bindgen-cs --library target/x86_64-pc-windows-msvc/release/lazymail_core.dll --out-dir windows/LazyMail.App/Generated
      - name: Publish x64
        run: dotnet publish windows/LazyMail.App -c Release -r win-x64 -p:Platform=x64 -p:CoreDir=${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\ -o "$env:RUNNER_TEMP/publish-x64"
      - name: Start the app
        shell: powershell
        run: ./windows/smoke.ps1 -Exe (Join-Path $env:RUNNER_TEMP 'publish-x64/LazyMail.exe')
      - name: Publish arm64
        run: dotnet publish windows/LazyMail.App -c Release -r win-arm64 -p:Platform=ARM64 -p:CoreDir=${{ github.workspace }}\target\aarch64-pc-windows-msvc\release\ -o "$env:RUNNER_TEMP/publish-arm64"
