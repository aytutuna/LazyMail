[graph]
# The core is not built for wasm, where the platform verifier would pull in webpki-root-certs.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[advisories]
version = 2

[licenses]
private = { ignore = true }
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "blessing",
    "WTFPL",
]

[bans]
multiple-versions = "warn"
# TLS goes through aws-lc-rs only.
deny = [{ name = "ring" }]
