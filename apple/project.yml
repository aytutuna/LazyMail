name: LazyMail

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 8XT2U634Z4
    CORE_VERSION: ""

targets:
  LazyMail:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: LazyMail
        excludes:
          - LazyMail.entitlements
    dependencies:
      - framework: LazyMailCore.xcframework
        embed: false
    info:
      path: LazyMail/Info.plist
      properties:
        CFBundleDisplayName: Lazy Mail
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: Lazy Mail
        PRODUCT_MODULE_NAME: LazyMail
        PRODUCT_BUNDLE_IDENTIFIER: com.lazymail.lazymail
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": LazyMail/LazyMail.entitlements

  LazyMailUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [UITests]
    dependencies:
      - target: LazyMail
    info:
      path: UITests/Info.plist
      properties:
        CoreVersion: $(CORE_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazymail.lazymail.uitests
        TEST_TARGET_NAME: LazyMail
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  LazyMail:
    build:
      targets:
        LazyMail: all
    test:
      targets:
        - LazyMailUITests
